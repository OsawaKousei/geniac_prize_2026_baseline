[project]
name = "geniac-tutorial-serve"
version = "0.1.0"
description = "Locked vLLM serving environment for the Slurm tutorial."
requires-python = "==3.12.*"
dependencies = [
  "vllm==0.26.0",
  "transformers==5.22.2",
  "huggingface-hub",
  # Pin the CUDA builds of vLLM's Torch dependencies explicitly.
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
  "torchcodec==0.17.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
